name: Deploy Native Storybook to Cloudflare Pages

# Deploys the @synotech/components-native example app (Storybook web export:
# QA/Gallery + QA/Gallery2 sweep stories) to a Cloudflare Pages project.
# Trigger: every push/merge to master.

on:
    push:
        branches:
            - master

concurrency:
    group: deploy-native-storybook-${{ github.ref }}
    cancel-in-progress: false

env:
    NODE_VERSION: "20"
    PAGES_PRODUCTION_BRANCH: "master"
    PAGES_PROJECT_NAME: "infomentor-ui-storybook-native"
    AWS_REGION: "us-east-1"

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
            deployments: write
            packages: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "yarn"
                  cache-dependency-path: example/yarn.lock

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::140991650843:role/gha-synoptic-wallet-ui
                  aws-region: ${{ env.AWS_REGION }}

            - name: Fetch deployment secrets from SSM
              run: |
                  get_param() {
                    aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text --region us-east-1 2>/dev/null || echo ""
                  }
                  CLOUDFLARE_API_TOKEN=$(get_param "/infomentor/production/cloudflare-api-token")
                  if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then echo "::add-mask::${CLOUDFLARE_API_TOKEN}"; fi
                  CLOUDFLARE_ACCOUNT_ID=$(get_param "/infomentor/production/cloudflare-account-id")
                  if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "::add-mask::${CLOUDFLARE_ACCOUNT_ID}"; fi
                  {
                    echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}"
                    echo "CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}"
                  } >> "$GITHUB_ENV"

            - name: Install example dependencies
              working-directory: example
              run: yarn install --frozen-lockfile --ignore-engines

            - name: Export Storybook web bundle
              working-directory: example
              run: EXPO_PUBLIC_STORYBOOK_ENABLED=true npx expo export --platform web --output-dir storybook-static

            - name: Ensure Pages project exists
              run: |
                  npx wrangler pages project create "${PAGES_PROJECT_NAME}" --production-branch="${PAGES_PRODUCTION_BRANCH}" 2>/dev/null || true

            - name: Deploy to Cloudflare Pages
              working-directory: example
              run: |
                  set -euo pipefail
                  npx wrangler pages deploy storybook-static \
                    --project-name="${PAGES_PROJECT_NAME}" \
                    --branch="${PAGES_PRODUCTION_BRANCH}" \
                    --commit-hash="${GITHUB_SHA}" \
                    --commit-message="Deploy ${PAGES_PROJECT_NAME} storybook from ${GITHUB_REF_NAME} (#${GITHUB_RUN_NUMBER})" \
                    --commit-dirty=true
